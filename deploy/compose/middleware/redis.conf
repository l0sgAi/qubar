# Qubar 生产 Redis。requirepass 由 compose 命令行注入（见 compose.yml），不写在本文件。
bind 0.0.0.0
protected-mode yes
port 6379

# 持久化：Sa-Token 会话 + 写回计数器，AOF everysec（最多丢 1s）+ RDB 兜底
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
save 3600 1 300 100 60 10000
dir /data

# 内存：noeviction —— 宁可写失败也不静默淘汰会话/计数器（与本机一致）
maxmemory 1gb
maxmemory-policy noeviction

timeout 0
tcp-keepalive 300
