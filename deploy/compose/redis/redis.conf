# 密码由命令行 --requirepass 注入（见 compose.prod.yml）。只在 compose 内网可达。
bind 0.0.0.0
protected-mode yes
appendonly yes
appendfsync everysec
save 900 1
save 300 100
# Sa-Token 会话 + 写后聚合计数器都在这里；只淘汰带 TTL 的 key（会话/缓存），计数器不会被淘汰。
maxmemory 512mb
maxmemory-policy volatile-lru
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
