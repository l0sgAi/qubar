# gitleaks 配置（l0sgAi/qubar#49）：默认规则 + YAML 配置里的低熵凭据。
# 默认规则按熵值判断，抓不到 `password: 1q2w3e4r5t` 这类弱口令，故补一条按键名匹配的规则。
[extend]
useDefault = true

[[rules]]
id = "qubar-yaml-credential"
description = "Credential value in YAML config (use a placeholder in configs/config.example.yaml)"
regex = '''(?im)^\s*(password|data_key|secret_access_key|client_secret|api_token|api_key)\s*:\s*["']?([^"'\s#]{4,})'''
secretGroup = 2
keywords = ["password", "data_key", "secret_access_key", "client_secret", "api_token", "api_key"]
path = '''\.ya?ml$'''

[rules.allowlist]
regexTarget = "secret"
regexes = ['''^(?i)(xxx+|change_?me|your_[a-z_]+|<[^>]+>|\$\{[^}]+\}|password|nacos)$''']
