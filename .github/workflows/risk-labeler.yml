# 按改动路径给 PR 打 risk:high（规则见 .github/labeler.yml，l0sgAi/qubar#67 P2）。
# pull_request_target：fork PR 也能写标签；不 checkout、不执行 PR 代码，配置取自目标分支。
name: risk-labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: false # 只加不减：去掉 risk:high 由人决定
