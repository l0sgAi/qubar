# Secret scanning (l0sgAi/qubar#49): fail PRs / pushes that add credentials.
# Also enable GitHub push protection: Settings → Code security → Secret scanning.
name: secret-scan

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
