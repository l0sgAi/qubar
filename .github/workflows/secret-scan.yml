# Secret scanning (l0sgAi/qubar#49): fail PRs / pushes that add credentials.
# Also enable GitHub push protection: Settings → Code security → Secret scanning.
name: secret-scan

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        if: github.event_name != 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 扫描 pr-sync 更新后的提交
        if: github.event_name == 'workflow_dispatch'
        run: |
          base=$(git merge-base origin/develop HEAD)
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            zricethezav/gitleaks:v8.30.0 git --redact --log-opts="$base..HEAD" .
