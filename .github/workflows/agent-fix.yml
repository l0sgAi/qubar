# agent PR 自动修复（l0sgAi/qubar#67 P3）。只处理同仓库的 agent/ 分支（agent-dispatch 开的 PR）。
#
#   reason=ci       ：ci 工作流失败（workflow_run，只在默认分支 main 上生效）
#   reason=review   ：claude-review 结论有阻塞问题（claude-review 派发）
#   reason=conflict ：pr-sync 更新分支冲突（pr-sync 派发）
#
# 每个 PR 最多自动修 3 次（按 PR 上的 <!-- agent-fix --> 标记计数），超过后打 hold（关掉 auto-merge）并请人处理。
# 安全：会 checkout 并执行 PR 分支代码（make verify），只对有写权限的人 / claude[bot] 才能推的同仓库分支生效。
name: agent-fix

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: PR 编号
        required: true
      reason:
        description: ci / review / conflict
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

concurrency:
  group: agent-fix-${{ inputs.pr || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.pr.outputs.number }}
      ref: ${{ steps.pr.outputs.ref }}
      reason: ${{ steps.pr.outputs.reason }}
      run: ${{ steps.pr.outputs.run }}
    steps:
      - id: pr
        uses: actions/github-script@v8
        env:
          PR_INPUT: ${{ inputs.pr }}
          REASON_INPUT: ${{ inputs.reason }}
        with:
          script: |
            const { owner, repo } = context.repo;
            let number = Number(process.env.PR_INPUT || 0);
            let reason = process.env.REASON_INPUT || 'ci';
            const run = context.payload.workflow_run;
            if (run) {
              number = run.pull_requests?.[0]?.number;
              if (!number) { core.info('CI run not tied to a same-repo PR'); return; }
            }
            if (!['ci', 'review', 'conflict'].includes(reason)) { core.setFailed(`unknown reason ${reason}`); return; }
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pr.state !== 'open' || !pr.head.ref.startsWith('agent/') || pr.head.repo?.full_name !== `${owner}/${repo}`) {
              core.info(`#${number} is not an open same-repo agent/ PR, skip`); return;
            }
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
            const attempts = comments.filter(c => (c.body || '').includes('<!-- agent-fix -->')).length;
            if (attempts >= 3) {
              const labels = pr.labels.map(l => l.name);
              if (!labels.includes('hold')) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: ['hold'] });
                // GITHUB_TOKEN 打的标签不会触发 pr-gate，这里直接关掉 auto-merge
                await github.graphql('mutation($id: ID!) { disablePullRequestAutoMerge(input: {pullRequestId: $id}) { clientMutationId } }',
                  { id: pr.node_id }).catch(e => core.info(`disable auto-merge: ${e.message}`));
                await github.rest.issues.createComment({ owner, repo, issue_number: number,
                  body: `agent-fix：自动修复已达 3 次上限（本次原因：${reason}），已打 \`hold\` 关闭 auto-merge，需要人工处理。` });
              }
              return;
            }
            await github.rest.issues.createComment({ owner, repo, issue_number: number,
              body: `<!-- agent-fix -->\nagent-fix：第 ${attempts + 1}/3 次自动修复，原因：\`${reason}\`（[run](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})）。` });
            core.setOutput('number', number);
            core.setOutput('ref', pr.head.ref);
            core.setOutput('reason', reason);
            core.setOutput('run', run ? String(run.id) : '');

  fix:
    needs: prepare
    if: needs.prepare.outputs.number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 本工作流由 claude[bot]（agent 推的提交）或 github-actions[bot]（GITHUB_TOKEN 派发）触发；
          # claude-code-action 默认拒绝 bot 触发（#122）。只放行这两个，不用 '*'。
          allowed_bots: "claude,github-actions"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ needs.prepare.outputs.number }}
            BRANCH: ${{ needs.prepare.outputs.ref }}
            REASON: ${{ needs.prepare.outputs.reason }}
            CI RUN: ${{ needs.prepare.outputs.run }}

            你在修复 qubar 的一个 agent PR（当前已 checkout 到 BRANCH）。先读 CLAUDE.md，严格遵守。
            - REASON=ci：`gh run view <CI RUN> --log-failed` 看失败原因并修复。
            - REASON=review：`gh pr view --comments` 和 `gh api repos/${{ github.repository }}/pulls/${{ needs.prepare.outputs.number }}/comments`
              找最新的 claude-review 总结与行内意见，修复所有阻塞问题；非阻塞建议合理的顺手改，不合理的在回复里说明。
            - REASON=conflict：`git fetch origin develop && git merge origin/develop`，解决冲突（两边的意图都要保留）。
            修完必须 `make dev-up && make verify` 通过；改了 infrastructure / SQL / Lua / Redpanda 再跑 `make test-integration`。
            只改与这次修复相关的代码；不要改 CLAUDE.md、.github/、.claude/、Makefile、lint 配置来绕过检查。
            用 Conventional Commits 提交并 `git push`（不要 force push）。
            如果无法修复（需求不清、需要改高风险路径、需要人决定），不要硬改，执行 `gh pr edit ${{ needs.prepare.outputs.number }} --add-label hold`。
            不要自己发 PR 评论（Actions 里 `gh pr comment` 一律被拒）：把改了什么、或为什么没修，写进结构化输出的 `note` 字段（中文 Markdown），
            工作流会替你发到 PR 上；`fixed` 表示这次是否已推送修复。
            命令规则：多行正文（PR / issue / 评论 / commit message）一律先用 Write 工具写到仓库内的 `tmp/` 目录
            （已 git-ignore，例如 `tmp/commit-msg.txt`），再用 `--body-file` / `git commit -F`；不要写到 /tmp（工作目录外会被拒），
            命令里也不要用 heredoc、`$(...)`、管道或 `&&`，这些会被权限规则拦下。
          claude_args: >-
            --max-turns 120
            --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,Bash(make:*),Bash(go:*),Bash(gofmt:*),Bash(git:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr edit:*),Bash(gh run view:*),Bash(gh api repos/${{ github.repository }}/pulls/*)"
            --json-schema '{"type":"object","properties":{"fixed":{"type":"boolean"},"note":{"type":"string"}},"required":["fixed","note"]}'

      - name: Post note
        if: always()
        uses: actions/github-script@v8
        env:
          OUTPUT: ${{ steps.claude.outputs.structured_output }}
          NUMBER: ${{ needs.prepare.outputs.number }}
          REASON: ${{ needs.prepare.outputs.reason }}
        with:
          script: |
            // Claude 在 Actions 里不能 gh pr comment，说明由工作流代发
            const { owner, repo } = context.repo;
            let out = {};
            try { out = JSON.parse(process.env.OUTPUT || '{}'); } catch {}
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const head = out.fixed === true ? `agent-fix：已推送修复（原因：\`${process.env.REASON}\`）` :
              out.fixed === false ? `agent-fix：未修复（原因：\`${process.env.REASON}\`），需要人工处理` :
              `agent-fix：运行没有返回结果（原因：\`${process.env.REASON}\`），请看 run 日志`;
            await github.rest.issues.createComment({ owner, repo, issue_number: Number(process.env.NUMBER),
              body: `${head}（[run](${runUrl})）\n\n${(out.note || '').trim()}`.slice(0, 65000) });
