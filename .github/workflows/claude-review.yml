# Claude 代码审查（l0sgAi/qubar#67 P3）。结果写成 commit status `claude-review`（develop 分支规则的必需检查）：
#   pass → success；有阻塞问题 → failure（agent/ 分支自动交给 agent-fix，reason=review）。
#
# 触发：同仓库 PR 的 opened / synchronize / reopened / ready_for_review（草稿跳过）；
#       workflow_dispatch(carry=true)：pr-sync 用 update-branch 把 develop 合进来之后，如果新 head 是
#       「上一个已通过审查的 head + 合并 develop」，直接沿用结论，不再花一次审查。
# fork PR 拿不到密钥，不审查（也不会有 claude-review 状态，需要维护者处理）。
# claude-code-action 要求工作流文件与默认分支（main）上的版本完全一致，否则跳过（状态记为 error）：
# 本文件要发版到 main 才生效；修改本文件的 PR 自己审查不了，需要 admin 在 PR 上越过规则合并。
name: claude-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: PR 编号
        required: true
      carry:
        description: 只在新 head 是「已通过审查的提交 + 合并 develop」时沿用结论
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write
  actions: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.pr.outputs.number }}
      sha: ${{ steps.pr.outputs.sha }}
      ref: ${{ steps.pr.outputs.ref }}
      review: ${{ steps.pr.outputs.review }}
    steps:
      - id: pr
        uses: actions/github-script@v8
        env:
          PR_INPUT: ${{ inputs.pr }}
          CARRY: ${{ inputs.carry }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request?.number ?? Number(process.env.PR_INPUT);
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const sha = pr.head.sha;
            core.setOutput('number', number);
            core.setOutput('sha', sha);
            core.setOutput('ref', pr.head.ref);
            const skip = pr.draft || pr.state !== 'open' || pr.head.repo?.full_name !== `${owner}/${repo}`;
            if (skip) { core.setOutput('review', 'false'); return; }

            if (process.env.CARRY === 'true') {
              const { data: commit } = await github.rest.repos.getCommit({ owner, repo, ref: sha });
              if (commit.parents.length === 2) {
                const prev = commit.parents[0].sha;
                const { data: combined } = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: prev });
                const st = combined.statuses.find(s => s.context === 'claude-review');
                if (st?.state === 'success') {
                  await github.rest.repos.createCommitStatus({ owner, repo, sha, state: 'success', context: 'claude-review',
                    description: `carried from ${prev.slice(0, 7)} (develop merged in)` });
                  core.setOutput('review', 'false');
                  return;
                }
              }
            }
            await github.rest.repos.createCommitStatus({ owner, repo, sha, state: 'pending', context: 'claude-review', description: 'reviewing' });
            core.setOutput('review', 'true');

  review:
    needs: prepare
    if: needs.prepare.outputs.review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ needs.prepare.outputs.number }}
            HEAD: ${{ needs.prepare.outputs.sha }}

            审查这个合入 develop 的 PR。先读 CLAUDE.md 和 .agents/skills/qubar-skill/SKILL.md，用 `gh pr view` / `gh pr diff` 看改动。
            只报真实问题，不要风格偏好或泛泛建议。重点：
            1. 正确性：逻辑错误、边界、错误处理（不吞错误）、并发 / 事务、缓存与 DB 一致性、分页。
            2. qubar 规则：分层与跨域只走 Facade（业务层不 import 兄弟域或 hertz）；插入显式 `sharedomain.NewID()`；
               不用 AutoMigrate；迁移 forward-only 且兼容旧版本应用（expand / contract），新表登记 CDC 或 `-- cdc: none`；
               新配置同步 config.example.yaml 与 config.dev.yaml；不提交密钥。
            3. 安全：鉴权 / 越权、SSRF（netguard）、注入、敏感数据进日志。
            4. 测试：改了 infrastructure / SQL / Lua / Redpanda 是否补了集成测试；PR 描述是否写了验证与未验证部分。
            5. 范围：是否与关联 issue 一致、有没有顺手改无关代码、业务代码是否明显超过 ~500 行。

            具体代码问题用 `mcp__github_inline_comment__create_inline_comment`（confirmed: true）标在对应行，每条写清问题、影响、修法。
            最后用 `gh pr comment` 发一条中文总结（结论 + 阻塞问题列表），开头写 `<!-- claude-review:${{ needs.prepare.outputs.sha }} -->`。
            阻塞问题 = 会导致 bug、数据问题、安全问题或违反上面 qubar 规则的问题；其他都是非阻塞建议。
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*)"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["pass","changes_requested"]},"blocking":{"type":"integer"},"summary":{"type":"string"}},"required":["verdict","blocking","summary"]}'

      - name: Report status
        if: always()
        uses: actions/github-script@v8
        env:
          OUTPUT: ${{ steps.claude.outputs.structured_output }}
          STEP_OUTCOME: ${{ steps.claude.outcome }}
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          SHA: ${{ needs.prepare.outputs.sha }}
          NUMBER: ${{ needs.prepare.outputs.number }}
          REF: ${{ needs.prepare.outputs.ref }}
        with:
          script: |
            const { owner, repo } = context.repo;
            let out = {};
            try { out = JSON.parse(process.env.OUTPUT || '{}'); } catch {}
            const sha = process.env.SHA;

            // 没有结论时说明原因。claude-code-action 在缺 token、或本工作流文件与 main 上的版本不一致时
            // 只打 warning 并跳过（步骤仍是 success），所以要在这里自己判断。
            async function noVerdictReason() {
              if (process.env.HAS_TOKEN !== 'true') return 'skipped: CLAUDE_CODE_OAUTH_TOKEN secret not set';
              const path = '.github/workflows/claude-review.yml';
              const blob = async ref => {
                try { return (await github.rest.repos.getContent({ owner, repo, path, ref })).data.sha; }
                catch (e) { if (e.status === 404) return null; throw e; }
              };
              const [onMain, current] = await Promise.all([blob('main'), blob(process.env.GITHUB_WORKFLOW_SHA)]);
              if (!onMain) return 'skipped: claude-review.yml is not on main yet (Claude workflows run only after release)';
              if (onMain !== current) return 'skipped: claude-review.yml differs from main (edited here or not released yet)';
              if (process.env.STEP_OUTCOME === 'failure') return 'Claude run failed, see run log';
              if (process.env.STEP_OUTCOME === 'cancelled') return 'Claude run cancelled or timed out';
              return 'Claude returned no verdict, see run log';
            }

            const ok = out.verdict === 'pass';
            const state = out.verdict ? (ok ? 'success' : 'failure') : 'error';
            let description;
            if (out.verdict) {
              description = ok ? 'no blocking issues' : `${out.blocking} blocking issue(s)`;
            } else {
              description = await noVerdictReason().catch(e => `no verdict (reason check failed: ${e.message})`);
              core.warning(`claude-review: ${description}`);
            }
            description = description.slice(0, 140);
            await github.rest.repos.createCommitStatus({ owner, repo, sha, state, context: 'claude-review', description,
              target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}` });
            if (out.verdict === 'changes_requested' && process.env.REF.startsWith('agent/')) {
              await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: 'agent-fix.yml', ref: 'develop',
                inputs: { pr: String(process.env.NUMBER), reason: 'review' } });
            }
