# 临时诊断（不合并）：用与 claude-review 相同的 prompt 和 --allowedTools 直接跑 CLI，打印被拒的工具调用。
name: tmp-claude-review-diag
on:
  pull_request:
    branches: [develop]
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  diag:
    if: github.head_ref == 'tmp/claude-review-diag-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: curl -fsSL https://claude.ai/install.sh | bash
      - run: mkdir -p tmp
      - name: Bash rule forms
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set +e
          printf 'diag: bash rule test\n' > tmp/body.md
          try() {
            rule="$1"; cmd="$2"
            out=$("$HOME/.local/bin/claude" -p "Run exactly this shell command once with the Bash tool and nothing else: $cmd" \
              --allowedTools "$rule" --max-turns 3 --output-format json 2>&1)
            echo "RAW rule=[$rule]: $(grep -oE '"result":"[^"]{0,300}|"permission_denials":\[[^]]{0,300}' <<< "$out" | tr '\n' ' ')"
            echo "RESULT rule=[$rule] cmd=[$cmd] denials=$(jq -c '[.permission_denials[] | .tool_input.command]' <<< "$out" 2>/dev/null)"
          }
          try 'Bash(gh issue comment:*)' "gh issue comment 92 --body-file tmp/body.md"
          try 'Bash(gh issue edit:*)' "gh issue edit 92 --add-label agent:found"
          try 'Bash(gh pr edit:*)' "gh pr edit $PR --add-label hold"
          try 'Bash(gh issue create:*)' "gh issue create --title tmp-diag-delete-me --body-file tmp/body.md"
          try 'Bash(git commit:*)' "git -c user.name=x -c user.email=x@x commit --allow-empty -m diag"
