# develop → main 由发布负责人执行。组件范围、首次接管及部分失败恢复见 docs/ops/product-release.md。
# 同一生产并发组内先固定候选包，再迁移 / 部署 API、验证兼容接口、部署 Pages、验收并发布产品版本。
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_infra:
        description: 强制执行 Terraform + Ansible
        type: boolean
        default: false
      force_deploy:
        description: 强制构建并发布当前 main
        type: boolean
        default: false
      force_web:
        description: 使用当前 main 的静态包接管 Pages
        type: boolean
        default: false
      force_migrate:
        description: 强制执行 schema 迁移（如 dirty 修复后重试）
        type: boolean
        default: false
      rollback:
        description: 回滚到上一个成功版本（不构建）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-prod
  cancel-in-progress: false # 不打断进行中的 apply / 发布

env:
  IMAGE: ghcr.io/l0sgai/qubar
  SMOKE_URL: https://api.qubar.site/healthz

jobs:
  changes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub 只向有推送权限的令牌列出 Release 草稿
      actions: read
      pages: read
    outputs:
      app: ${{ steps.plan.outputs.app }}
      web: ${{ steps.plan.outputs.web }}
      imported: ${{ steps.plan.outputs.imported }}
      infra: ${{ steps.plan.outputs.infra }}
      db: ${{ steps.plan.outputs.db }}
      prev: ${{ steps.version.outputs.prev }}
      next: ${{ steps.version.outputs.next }}
      product: ${{ steps.plan.outputs.app == 'true' || steps.plan.outputs.web == 'true' }}
      reuse: ${{ steps.draft.outputs.reuse }}
      published: ${{ steps.version.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_APP: ${{ inputs.force_deploy }}
          FORCE_WEB: ${{ inputs.force_web }}
          FORCE_DB: ${{ inputs.force_migrate }}
          FORCE_INFRA: ${{ inputs.force_infra }}
          ROLLBACK: ${{ inputs.rollback }}
        run: |
          # 以最近成功发布为基线，失败或并发排队期间累积的变更一并纳入。
          base=$(gh run list -w release.yml -b main -s success -L 1 --json headSha --jq '.[0].headSha // empty')
          base=${base:-v0.9.0}
          git merge-base --is-ancestor "$base" HEAD
          product_base=$(git describe --first-parent --tags --abbrev=0 --match 'v[0-9]*' HEAD)
          python3 scripts/release-plan.py "$base" HEAD "$product_base" | tee -a "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"
      - id: version
        if: steps.plan.outputs.app == 'true' || steps.plan.outputs.web == 'true'
        run: |
          tag=$(git tag --points-at HEAD --list 'v[0-9]*' | head -1)
          if [[ -n "$tag" ]]; then
            printf 'prev=%s\nnext=%s\npublished=true\n' "$tag" "$tag" >> "$GITHUB_OUTPUT"
          else
            scripts/next-version.sh HEAD | tee -a "$GITHUB_OUTPUT"
          fi
      - id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          WEB: ${{ steps.plan.outputs.web }}
          NEXT: ${{ steps.version.outputs.next }}
          ROLLBACK: ${{ inputs.rollback }}
          PUBLISHED: ${{ steps.version.outputs.published }}
          PRODUCT: ${{ steps.plan.outputs.app == 'true' || steps.plan.outputs.web == 'true' }}
        run: |
          reuse=false
          if [[ "$ROLLBACK" != true ]]; then
            drafts=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '
              .[] | select(.draft and (.tag_name | test("^v[0-9]")) and any(.assets[]; .name == "candidate.json" and .state == "uploaded"))
              | [.tag_name, .target_commitish] | @tsv')
            if [[ -n "$drafts" ]]; then
              while IFS=$'\t' read -r tag sha; do
                if [[ "$tag" != "$NEXT" || "$sha" != "$GITHUB_SHA" ]]; then echo "先完成待恢复候选 $tag"; exit 1; fi
                reuse=true
              done <<< "$drafts"
            fi
          fi
          if [[ "$reuse" != true ]]; then test "$(git rev-parse origin/main)" = "$GITHUB_SHA"; fi
          if [[ "$PUBLISHED" == true ]]; then reuse=true; fi
          if [[ "$PRODUCT" == true ]]; then
            test -n "$NEXT" || { echo '没有待发布的产品提交'; exit 1; }
            # 真实用户流程由受保护的环境审核，缺少审核人则在部署前停止。
            gh api "repos/$GITHUB_REPOSITORY/environments/product-acceptance" --jq '.protection_rules' |
              jq -e 'any(.[]; .type == "required_reviewers" and (.reviewers | length) > 0)' >/dev/null
          fi
          if [[ "$WEB" == true ]]; then
            gh api "repos/$GITHUB_REPOSITORY/pages" |
              jq -e '.cname == "qubar.site" and .build_type == "workflow" and .https_enforced' >/dev/null
          fi
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"

  web-build:
    permissions:
      contents: read
      actions: read
    needs: changes
    if: (needs.changes.outputs.web == 'true' || needs.changes.outputs.imported == 'true') && needs.changes.outputs.reuse != 'true'
    uses: ./.github/workflows/web-build.yml

  test:
    needs: changes
    if: needs.changes.outputs.app == 'true' && needs.changes.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./pkg/...

  build:
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    needs: [changes, test]
    if: needs.changes.outputs.app == 'true' && needs.changes.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64 # ECS r9ae = x86_64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  stage:
    needs: [changes, build, web-build]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.product == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      digest: ${{ steps.stage.outputs.digest }}
      pages_hash: ${{ steps.stage.outputs.pages_hash }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.web == 'true' && needs.changes.outputs.reuse != 'true'
        with:
          name: github-pages
          path: ${{ runner.temp }}/built
      - id: stage
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PREV: ${{ needs.changes.outputs.prev }}
          NEXT: ${{ needs.changes.outputs.next }}
          REUSE: ${{ needs.changes.outputs.reuse }}
          PUBLISHED: ${{ needs.changes.outputs.published }}
          WEB: ${{ needs.changes.outputs.web }}
          APP: ${{ needs.changes.outputs.app }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: scripts/stage-product.sh
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-pages
          path: ${{ runner.temp }}/candidate/artifact.tar
          overwrite: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: needs.changes.outputs.web == 'true'
        with:
          name: previous-pages
          path: ${{ runner.temp }}/previous/artifact.tar
          overwrite: true
          if-no-files-found: error

  infra:
    needs: [changes, stage, web-build]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prod-access
        with:
          apply: "true"
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          deploy-ssh-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Install Ansible（独立 venv，避开 runner 预装的 pipx ansible-core）
        run: |
          python3 -m venv "$RUNNER_TEMP/ansible"
          "$RUNNER_TEMP/ansible/bin/pip" install -q "ansible-core>=2.19,<2.22"
          echo "$RUNNER_TEMP/ansible/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ansible/bin/ansible-galaxy" collection install -r deploy/ansible/requirements.yml

      - name: Ansible vars (0600, 不进命令行)
        env:
          PG_SUPERUSER_PASSWORD: ${{ secrets.PG_SUPERUSER_PASSWORD }}
          PG_OWNER_PASSWORD: ${{ secrets.PG_OWNER_PASSWORD }}
          PG_APP_PASSWORD: ${{ secrets.PG_APP_PASSWORD }}
          PG_DEBEZIUM_PASSWORD: ${{ secrets.PG_DEBEZIUM_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          QUBAR_CONFIG_YAML: ${{ secrets.QUBAR_CONFIG_YAML }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          umask 077
          jq -n --slurpfile tf "$RUNNER_TEMP/tf-outputs.json" '{
            pg_superuser_password: env.PG_SUPERUSER_PASSWORD,
            pg_owner_password:     env.PG_OWNER_PASSWORD,
            pg_app_password:       env.PG_APP_PASSWORD,
            pg_debezium_password:  env.PG_DEBEZIUM_PASSWORD,
            redis_password:        env.REDIS_PASSWORD,
            qubar_config_yaml:     env.QUBAR_CONFIG_YAML,
            r2_access_key_id:      env.R2_ACCESS_KEY_ID,
            r2_secret_access_key:  env.R2_SECRET_ACCESS_KEY,
            tunnel_token:          $tf[0].tunnel_token.value,
            ansible_host:          $tf[0].ssh_hostname.value
          }' > "$RUNNER_TEMP/ansible-vars.json"

      - name: Ansible apply
        working-directory: deploy/ansible
        env:
          ANSIBLE_FORCE_COLOR: "1"
        run: ansible-playbook site.yml -e "@$RUNNER_TEMP/ansible-vars.json" --private-key ~/.ssh/qubar_deploy

  migrate:
    needs: [changes, stage, infra]
    if: >-
      !failure() && !cancelled() && inputs.rollback != true &&
      (needs.changes.outputs.db == 'true' || needs.changes.outputs.app == 'true')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prod-access
        with:
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          deploy-ssh-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Sync migrations/（整目录替换，服务器无 rsync）
        run: |
          tar -C migrations -cf - --exclude README.md . | ssh "$PROD_SSH" '
            set -e; cd /opt/qubar/migrate
            rm -rf migrations.new && mkdir migrations.new && tar -xf - -C migrations.new
            rm -rf migrations && mv migrations.new migrations'

      - name: Migrate
        run: |
          # shellcheck disable=SC2029  # sha 有意在 runner 侧展开
          ssh "$PROD_SSH" /opt/qubar/bin/db-migrate.sh "${{ github.sha }}"

  deploy:
    needs: [changes, stage, infra, migrate]
    if: >-
      !failure() && !cancelled() && needs.changes.result == 'success' &&
      (needs.changes.outputs.product == 'true' || inputs.rollback == true ||
       needs.migrate.result == 'success' || needs.infra.result == 'success')
    outputs:
      image: ${{ steps.live.outputs.image }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prod-access
        with:
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          deploy-ssh-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: GHCR login on host（GITHUB_TOKEN 仅本 job 有效）
        if: needs.changes.outputs.app == 'true' || inputs.rollback == true
        run: echo "${{ secrets.GITHUB_TOKEN }}" | ssh "$PROD_SSH" docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Deploy
        env:
          DIGEST: ${{ needs.stage.outputs.digest }}
        if: needs.changes.outputs.app == 'true' || inputs.rollback == true
        run: |
          if [ "${{ inputs.rollback }}" = "true" ]; then
            ssh "$PROD_SSH" /opt/qubar/bin/deploy-app.sh --rollback
          else
            # shellcheck disable=SC2029  # 镜像名有意在 runner 侧展开
            ssh "$PROD_SSH" /opt/qubar/bin/deploy-app.sh "$IMAGE@$DIGEST"
          fi

      - name: CDC connectors（幂等）
        if: needs.changes.outputs.app == 'true' || needs.infra.result == 'success' || needs.migrate.result == 'success' || inputs.rollback == true
        run: ssh "$PROD_SSH" /opt/qubar/bin/register-connectors.sh

      - name: GHCR logout
        if: always() && (needs.changes.outputs.app == 'true' || inputs.rollback == true)
        run: ssh "$PROD_SSH" docker logout ghcr.io || true

      - name: Smoke（经 Cloudflare 外网）
        run: |
          for _ in $(seq 1 12); do
            curl -fsS --max-time 10 "$SMOKE_URL" && exit 0
            sleep 5
          done
          echo "smoke failed: $SMOKE_URL"; exit 1

      - name: 核对在运行的镜像、旧前端公开接口
        id: live
        env:
          EXPECTED: ${{ needs.stage.outputs.digest }}
        run: |
          image=$(ssh "$PROD_SSH" 'docker image inspect "$(docker inspect --format="{{.Image}}" qubar)" --format="{{json .RepoDigests}}"' |
            jq -er --arg prefix "$IMAGE@" '[.[] | select(startswith($prefix))] | first')
          [[ "$image" =~ @sha256:[0-9a-f]{64}$ ]]
          if [[ -n "$EXPECTED" ]]; then test "$image" = "$IMAGE@$EXPECTED"; fi
          curl -fsS --retry 3 --max-time 20 https://api.qubar.site/readyz > /dev/null
          curl -fsS --retry 3 --max-time 20 https://api.qubar.site/category/get |
            jq -e '.code == 200 and (.data | type == "array")' >/dev/null
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "产品提交 $GITHUB_SHA，运行镜像 $image，部署 $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"

  pages:
    outputs:
      attempt: ${{ steps.receipt.outputs.attempt }}
    needs: [changes, deploy, stage]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.web == 'true' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: candidate-pages
      - id: receipt
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  smoke:
    needs: [changes, deploy, stage, pages]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.product == 'true' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: candidate-pages
          path: ${{ runner.temp }}/candidate
      - run: python3 scripts/smoke-pages.py 'https://qubar.site' "$RUNNER_TEMP/candidate/artifact.tar"
      - run: echo "请按 docs/ops/product-release.md 完成账号冒烟，并在 product-acceptance 记录结果。" >> "$GITHUB_STEP_SUMMARY"

  accept:
    needs: smoke
    if: ${{ !failure() && !cancelled() && needs.smoke.result == 'success' }}
    runs-on: ubuntu-latest
    environment: product-acceptance
    steps:
      - run: echo "产品流程已由环境审核人验收"

  recover-pages:
    needs: [changes, stage, pages, smoke, accept]
    if: >-
      always() && needs.changes.outputs.web == 'true' && needs.stage.result == 'success' &&
      (needs.pages.result == 'failure' || (needs.pages.result == 'success' && needs.accept.result != 'success'))
    runs-on: ubuntu-latest
    environment: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
        with:
          artifact_name: previous-pages
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: previous-pages
          path: ${{ runner.temp }}/previous
      - run: python3 scripts/smoke-pages.py 'https://qubar.site' "$RUNNER_TEMP/previous/artifact.tar"

  github-release:
    needs: [changes, stage, deploy, pages, accept]
    if: ${{ !failure() && !cancelled() && needs.accept.result == 'success' && needs.changes.outputs.published != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 核对本次实际部署（恢复后需重跑整个工作流）
        env:
          WEB: ${{ needs.changes.outputs.web }}
          DEPLOY_ATTEMPT: ${{ needs.pages.outputs.attempt }}
        run: |
          if [[ "$WEB" == true ]]; then test "$DEPLOY_ATTEMPT" = "$GITHUB_RUN_ATTEMPT"; fi
      - uses: actions/download-artifact@v8
        with:
          name: candidate-pages
          path: ${{ runner.temp }}/final
      - name: 发布前复核持久清单摘要与域名上的内容
        env:
          PAGES_HASH: ${{ needs.stage.outputs.pages_hash }}
        run: |
          printf '%s  %s\n' "$PAGES_HASH" "$RUNNER_TEMP/final/artifact.tar" | sha256sum -c
          python3 scripts/smoke-pages.py 'https://qubar.site' "$RUNNER_TEMP/final/artifact.tar"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 记录生产状态并发布版本
        env:
          GH_TOKEN: ${{ github.token }}
          PREV: ${{ needs.changes.outputs.prev }}
          NEXT: ${{ needs.changes.outputs.next }}
          LIVE_IMAGE: ${{ needs.deploy.outputs.image }}
          PAGES_HASH: ${{ needs.stage.outputs.pages_hash }}
        run: |
          cd "$RUNNER_TEMP"
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          run="$base/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          restore_tag=$PREV
          if [[ "$restore_tag" == v0.9.0 ]]; then restore_tag=web-baseline-v0.9.0; fi
          jq -n --arg restore "$base/releases/download/$restore_tag/manifest.json" --arg sha "$GITHUB_SHA" --arg image "$LIVE_IMAGE" --arg prev "$PREV" \
            --arg hash "$PAGES_HASH" --arg url "$base/releases/download/$NEXT/pages.tar" --arg run "$run" \
            '{sha:$sha, image:$image, pages:{sha256:$hash,url:$url}, previous:$prev, previous_manifest:$restore, deployment:$run}' > manifest.json
          cd "$GITHUB_WORKSPACE"
          scripts/product-log.sh "$PREV" HEAD '- %s (%h)' > "$RUNNER_TEMP/notes.md"
          docker buildx imagetools create --prefer-index=false -t "$IMAGE:$NEXT" "$LIVE_IMAGE"
          gh release upload "$NEXT" "$RUNNER_TEMP/manifest.json" --clobber
          gh release edit "$NEXT" --draft=false --latest --notes-file "$RUNNER_TEMP/notes.md"
