# CI：PR（→ develop / main）与 develop 推送。不碰生产、不读生产密钥（公开仓库，fork PR 安全）。
name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./pkg/...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false
      - name: Terraform fmt / validate
        run: |
          terraform fmt -check -recursive deploy/terraform
          for d in bootstrap prod; do
            terraform -chdir=deploy/terraform/$d init -backend=false -input=false >/dev/null
            terraform -chdir=deploy/terraform/$d validate
          done

      - name: Ansible lint
        working-directory: deploy/ansible
        # 独立 venv：runner 预装的 pipx ansible-core 在 PATH 里会与 ansible-lint 自带版本冲突
        run: |
          python3 -m venv "$RUNNER_TEMP/ansible"
          "$RUNNER_TEMP/ansible/bin/pip" install -q ansible-lint
          export PATH="$RUNNER_TEMP/ansible/bin:$PATH" ANSIBLE_COLLECTIONS_PATH="$RUNNER_TEMP/collections"
          ansible-galaxy collection install -r requirements.yml -p "$ANSIBLE_COLLECTIONS_PATH"
          ansible-playbook site.yml --syntax-check
          ansible-lint --offline site.yml

      - name: Compose config
        run: |
          ES_IMAGE=x CONNECT_IMAGE=x PG_SUPERUSER_PASSWORD=x REDIS_PASSWORD=x \
            docker compose -f deploy/compose/middleware/compose.yml config -q
          QUBAR_IMAGE=x PG_APP_PASSWORD=x REDIS_PASSWORD=x \
            docker compose -f deploy/compose/app/compose.yml config -q

      - name: shellcheck
        run: shellcheck deploy/scripts/*.sh
