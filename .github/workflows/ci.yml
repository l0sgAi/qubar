# CI：PR（→ develop / main）与 develop 推送。不碰生产、不读生产密钥（公开仓库，fork PR 安全）。
name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 与本机 make verify 同一套 make 目标（db job 覆盖其余的 migrate-check / migrate-test）
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lint 按 merge-base 只看新增改动
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make fmt-check vet
      - name: lint
        env:
          LINT_BASE: origin/${{ github.base_ref || 'develop' }}
        run: make lint LINT_BASE="$LINT_BASE"
      - run: make test

  # 集成测试：起与本机相同的开发栈（deploy/compose/dev）→ 迁移 → make test-integration。
  # 只起测试用到的 PG / Redis / Redpanda（ES 镜像要现场构建 IK，当前没有 ES 集成测试）。
  integration:
    runs-on: ubuntu-latest
    env:
      QUBAR_TEST_REQUIRE_STACK: "1" # 栈不可达时失败而不是 Skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start dev stack
        run: docker compose -f deploy/compose/dev/compose.yml up -d --wait postgres redis redpanda
      - run: make dev-migrate
      - run: make test-integration
      - name: Stack logs
        if: failure()
        run: docker compose -f deploy/compose/dev/compose.yml logs --tail=200 postgres redis redpanda

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 数据库迁移：规范检查 + Squawk + 临时 PG18 从零回放（规则见 migrations/README.md）
  db:
    runs-on: ubuntu-latest
    env:
      MIGRATE_IMAGE: migrate/migrate:v4.20.1 # 与 deploy/ansible/group_vars/all.yml migrate_image 一致
      PG_IMAGE: postgres:18.4
      SQUAWK_VERSION: "2.69.0"
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: qubar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d qubar"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Base ref
        id: base
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            echo "ref=origin/$BASE_REF" >> "$GITHUB_OUTPUT"
          elif [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -qE '^0+$'; then
            echo "ref=$BEFORE" >> "$GITHUB_OUTPUT"
          fi

      - name: Migration rules
        env:
          ALLOW_MIGRATION_EDIT: ${{ contains(github.event.pull_request.labels.*.name, 'migration-fix') }}
        run: scripts/check-migrations.sh ${{ steps.base.outputs.ref }}

      - name: Squawk（变更的迁移，排除基线）
        env:
          BASE: ${{ steps.base.outputs.ref }}
        run: |
          if [ -n "$BASE" ]; then
            mapfile -t files < <(git diff --name-only --diff-filter=AM "$BASE" HEAD -- 'migrations/*.up.sql' | grep -v '_baseline\.up\.sql$' || true)
          else
            mapfile -t files < <(printf '%s\n' migrations/*.up.sql | grep -v '_baseline\.up\.sql$' || true)
          fi
          [ "${#files[@]}" -gt 0 ] || { echo "no migration changes"; exit 0; }
          curl -fsSL -o "$RUNNER_TEMP/squawk" \
            "https://github.com/sbdchd/squawk/releases/download/v$SQUAWK_VERSION/squawk-linux-x64"
          chmod +x "$RUNNER_TEMP/squawk"
          "$RUNNER_TEMP/squawk" "${files[@]}"

      - name: Replay all migrations on empty PG18
        run: |
          psql() { docker run --rm -i --network host -e PGPASSWORD=ci "$PG_IMAGE" psql -h 127.0.0.1 -U postgres -d qubar -v ON_ERROR_STOP=1 "$@"; }
          migrate() {
            docker run --rm --network host -e PGPASSWORD=ci -v "$PWD/migrations:/migrations:ro" "$MIGRATE_IMAGE" \
              -path /migrations \
              -database 'postgres://qubar_owner@127.0.0.1:5432/qubar?sslmode=disable&x-migrations-table="public"."schema_migrations"&x-migrations-table-quoted=1' "$@"
          }
          psql -q < .github/ci/pg-init.sql
          migrate up
          out=$(migrate up 2>&1); echo "$out"
          grep -q 'no change' <<< "$out"   # 二次执行必须是 no-op
          migrate version
          psql -tAc "select count(*) || ' tables in domains' from pg_tables where schemaname = 'domains'"
          # 最终 schema 供 review
          docker run --rm --network host -e PGPASSWORD=ci "$PG_IMAGE" \
            pg_dump -h 127.0.0.1 -U postgres -d qubar --schema-only -n domains --no-owner --no-privileges > schema.sql

      - uses: actions/upload-artifact@v4
        with:
          name: db-schema
          path: schema.sql
          retention-days: 14

  iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false
      - name: Terraform fmt / validate
        run: |
          terraform fmt -check -recursive deploy/terraform
          for d in bootstrap prod; do
            terraform -chdir=deploy/terraform/$d init -backend=false -input=false >/dev/null
            terraform -chdir=deploy/terraform/$d validate
          done

      - name: Ansible lint
        working-directory: deploy/ansible
        # 独立 venv：runner 预装的 pipx ansible-core 在 PATH 里会与 ansible-lint 自带版本冲突
        run: |
          python3 -m venv "$RUNNER_TEMP/ansible"
          "$RUNNER_TEMP/ansible/bin/pip" install -q ansible-lint
          export PATH="$RUNNER_TEMP/ansible/bin:$PATH" ANSIBLE_COLLECTIONS_PATH="$RUNNER_TEMP/collections"
          ansible-galaxy collection install -r requirements.yml -p "$ANSIBLE_COLLECTIONS_PATH"
          ansible-playbook site.yml --syntax-check
          ansible-lint --offline site.yml

      - name: Compose config
        run: |
          ES_IMAGE=x CONNECT_IMAGE=x PG_SUPERUSER_PASSWORD=x REDIS_PASSWORD=x \
            docker compose -f deploy/compose/middleware/compose.yml config -q
          QUBAR_IMAGE=x PG_APP_PASSWORD=x REDIS_PASSWORD=x \
            docker compose -f deploy/compose/app/compose.yml config -q

      - name: shellcheck
        run: shellcheck deploy/scripts/*.sh scripts/*.sh
